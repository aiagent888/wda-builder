name: Build WDA (Xcode 16, for iOS 15)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout WebDriverAgent
        uses: actions/checkout@v4
        with:
          repository: appium/WebDriverAgent
          ref: master
          submodules: true

      - name: Setup Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Bootstrap
        run: |
          if [ -f "./Scripts/bootstrap.sh" ]; then
            bash ./Scripts/bootstrap.sh -d
          fi

      - name: Neutralize asset catalogs (authored by newer Xcode)
        run: |
          find . -name 'Assets.xcassets' -not -path './dd/*' | while read c; do
            echo "replacing: $c"
            rm -rf "$c"
            mkdir -p "$c"
            printf '{ "info" : { "author" : "xcode", "version" : 1 } }' > "$c/Contents.json"
          done

      - name: Build WDA (build-for-testing)
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -sdk iphoneos \
            -configuration Release \
            -destination generic/platform=iOS \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            -derivedDataPath dd 2>&1 | tail -15

      - name: Package IPA (strip dSYM)
        run: |
          APP=$(find dd/Build/Products -name 'WebDriverAgentRunner-Runner.app' -type d | head -1)
          echo "APP=$APP"
          rm -rf "$APP/PlugIns/WebDriverAgentRunner.xctest.dSYM"
          test -f "$APP/WebDriverAgentRunner-Runner" || { echo "❌ 主程序缺失,构建未完成"; exit 1; }
          test -f "$APP/PlugIns/WebDriverAgentRunner.xctest/WebDriverAgentRunner" || { echo "❌ xctest缺失"; exit 1; }
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry WDA-xcode16.ipa Payload
          ls -lh WDA-xcode16.ipa

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: WDA-xcode16
          path: WDA-xcode16.ipa
          retention-days: 30
